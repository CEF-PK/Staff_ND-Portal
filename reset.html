<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEF Pakistan — Reset Password</title>
<link rel="icon" type="image/webp" href="assets/cef-logo.webp">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body style="min-height:100vh;background:#f5f7fb;display:flex;align-items:center;justify-content:center;padding:24px">
<div class="card" style="width:min(520px,100%);padding:32px">
  <div style="text-align:center"><img src="assets/cef-logo.webp" alt="CEF" style="height:70px;max-width:220px;object-fit:contain"><h1 style="color:#123e78;margin:14px 0 6px">Reset Your Password</h1><p class="kpi-note">Create a new secure password for your CEF Pakistan account.</p></div>
  <form id="resetForm" class="form-grid" style="margin-top:20px">
    <label class="full">New Password<input id="newPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"></label>
    <label class="full">Confirm Password<input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="Re-enter your password"></label>
    <div class="actions full"><button class="primary" id="saveBtn">UPDATE PASSWORD</button></div>
  </form>
  <p id="status" class="kpi-note" style="margin-top:16px;text-align:center"></p>
</div>
<script>
(() => {
  const C=window.CEF_CONFIG||{};
  const status=document.getElementById('status');
  const setStatus=(m,good=false)=>{status.textContent=m;status.style.color=good?'#237a4b':'#9d183f'};
  if(!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY || C.SUPABASE_ANON_KEY.includes('YOUR_')){setStatus('Configure Supabase credentials in config.js first.');return;}
  const client=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
  let ready=false;
  async function check(){const {data}=await client.auth.getSession(); if(data.session){ready=true;setStatus('Your secure recovery session is ready.',true);return} setStatus('This reset link is invalid or has expired. Please request a new password reset email.');}
  client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY' && session){ready=true;setStatus('Secure recovery session ready. Enter your new password.',true);}});
  document.getElementById('resetForm').onsubmit=async e=>{e.preventDefault();if(!ready){await check();if(!ready)return;}const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a.length<8){setStatus('Password must be at least 8 characters.');return}if(a!==b){setStatus('Passwords do not match.');return}const {error}=await client.auth.updateUser({password:a});if(error){setStatus(error.message);return}setStatus('Password updated successfully. You can now sign in to the CEF Pakistan portal.',true);setTimeout(()=>location.href='index.html',1200);};
  check();
})();
</script>
</body></html>
